name: Build RAZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'scripts/apply_branding.py'
      - 'config/brand.json'
      - 'assets/icons/**'

permissions:
  contents: read

concurrency:
  group: raz-android-build-arm64-optimized
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build debug APK (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
    steps:
      - name: Checkout RAZ customization files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate API secrets (optional for test-only build)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TG_API_ID" && -z "$TG_API_HASH" ]]; then
            echo "::warning::No personal Telegram API credentials supplied. This build will use the upstream sample credentials for testing only. Do not distribute this APK."
          elif [[ ! "$TG_API_ID" =~ ^[0-9]+$ || ! "$TG_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Set both TG_API_ID and TG_API_HASH to valid values, or leave both unset for a test-only build."
            exit 1
          fi

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Download pinned official Telegram Android source
        env:
          UPSTREAM_COMMIT: f32ffeec763f0bdbf4bec25b52d654f77bff733d
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/DrKLO/Telegram.git upstream
          git -C upstream fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          git -C upstream submodule sync --recursive
          git -C upstream submodule update --init --recursive --depth=1
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          echo "Upstream commit: $(git -C upstream rev-parse HEAD)" | tee upstream-commit.txt

      - name: Apply RAZ branding
        env:
          RAZ_ALLOW_UPSTREAM_TEST_API: '1'
        run: python3 scripts/apply_branding.py upstream

      - name: Restrict debug build to ARM64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          app_path = Path("upstream/TMessagesProj_App/build.gradle")
          app_source = app_path.read_text()
          app_pattern = r'(?m)^([ \t]*afat[ \t]*\{[ \t]*\n[ \t]*ndk[ \t]*\{[ \t]*\n[ \t]*abiFilters[ \t]+)[^\n]+'
          app_updated, app_count = re.subn(app_pattern, r'\1"arm64-v8a"', app_source, count=1)
          if app_count != 1:
              raise SystemExit("Could not locate the app afat ABI filter; refusing an unsafe build edit")
          app_path.write_text(app_updated)

          library_path = Path("upstream/TMessagesProj/build.gradle")
          library_source = library_path.read_text()
          library_anchor = '        minSdkVersion 23\n        targetSdkVersion 36\n'
          if library_source.count(library_anchor) != 1:
              raise SystemExit("Could not locate the library defaultConfig SDK settings; refusing an unsafe build edit")
          library_updated = library_source.replace(
              library_anchor,
              library_anchor + '\n        ndk {\n            abiFilters "arm64-v8a"\n        }\n',
              1,
          )
          library_path.write_text(library_updated)
          print("Configured both app and Telegram library native builds for arm64-v8a only")
          PY

      - name: Build ARM64 debug APK
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Collect APK and source commit record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp upstream/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk artifact/RAZ-debug-arm64.apk
          cp upstream-commit.txt artifact/

      - name: Upload RAZ APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAZ-debug-arm64
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
