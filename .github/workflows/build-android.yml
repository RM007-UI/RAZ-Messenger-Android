name: Build RAZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'scripts/apply_branding.py'
      - 'config/brand.json'
      - 'assets/icons/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: raz-android-build-arm64-optimized
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build debug APK (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
    steps:
      - name: Checkout RAZ customization files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore persistent RAZ debug signing key
        id: raz-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: raz-debug-signing-v1

      - name: Restore signing key from previous private artifact or initialize it
        if: steps.raz-signing-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          restored=false
          previous_run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-android.yml --branch main --status completed --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [[ -n "$previous_run_id" ]]; then
            restore_dir="$RUNNER_TEMP/raz-signing-restore"
            mkdir -p "$restore_dir"
            if gh run download "$previous_run_id" --repo "$GITHUB_REPOSITORY" --name RAZ-debug-signing-key-backup --dir "$restore_dir" >/dev/null 2>&1; then
              if [[ -f "$restore_dir/debug.keystore" ]]; then
                install -m 600 "$restore_dir/debug.keystore" "$HOME/.android/debug.keystore"
                restored=true
                echo "Restored the persistent RAZ debug signing key from a previous private artifact."
              fi
            fi
          fi
          if [[ "$restored" != true ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RAZ Debug, OU=RAZ, O=RM007-UI, C=US"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Created the first persistent RAZ debug signing key."
          fi

      - name: Validate API secrets (optional for test-only build)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TG_API_ID" && -z "$TG_API_HASH" ]]; then
            echo "::warning::No personal Telegram API credentials supplied. This build will use the upstream sample credentials for testing only. Do not distribute this APK."
          elif [[ ! "$TG_API_ID" =~ ^[0-9]+$ || ! "$TG_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Set both TG_API_ID and TG_API_HASH to valid values, or leave both unset for a test-only build."
            exit 1
          fi

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Download pinned official Telegram Android source
        env:
          UPSTREAM_COMMIT: f32ffeec763f0bdbf4bec25b52d654f77bff733d
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/DrKLO/Telegram.git upstream
          git -C upstream fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          git -C upstream submodule sync --recursive
          git -C upstream submodule update --init --recursive --depth=1
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          echo "Upstream commit: $(git -C upstream rev-parse HEAD)" | tee upstream-commit.txt

      - name: Apply RAZ branding
        env:
          RAZ_ALLOW_UPSTREAM_TEST_API: '1'
        run: python3 scripts/apply_branding.py upstream

      - name: Restrict debug build to ARM64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          app_path = Path("upstream/TMessagesProj_App/build.gradle")
          app_source = app_path.read_text()
          app_pattern = r'(?m)^([ \t]*afat[ \t]*\{[ \t]*\n[ \t]*ndk[ \t]*\{[ \t]*\n[ \t]*abiFilters[ \t]+)[^\n]+'
          app_updated, app_count = re.subn(app_pattern, r'\1"arm64-v8a"', app_source, count=1)
          if app_count != 1:
              raise SystemExit("Could not locate the app afat ABI filter; refusing an unsafe build edit")
          app_path.write_text(app_updated)

          library_path = Path("upstream/TMessagesProj/build.gradle")
          library_source = library_path.read_text()
          library_anchor = '        minSdkVersion 23\n        targetSdkVersion 36\n'
          if library_source.count(library_anchor) != 1:
              raise SystemExit("Could not locate the library defaultConfig SDK settings; refusing an unsafe build edit")
          library_updated = library_source.replace(
              library_anchor,
              library_anchor + '\n        ndk {\n            abiFilters "arm64-v8a"\n        }\n',
              1,
          )
          library_path.write_text(library_updated)
          print("Configured both app and Telegram library native builds for arm64-v8a only")
          PY

      - name: Build ARM64 debug APK
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Collect APK, source overlay, and signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact "$RUNNER_TEMP/raz-source-overlay"
          cp upstream/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk artifact/RAZ-debug-arm64.apk
          cp upstream-commit.txt artifact/
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | awk '/SHA256:/ {print $0}' > artifact/RAZ-signing-certificate-sha256.txt
          test -s artifact/RAZ-signing-certificate-sha256.txt

          overlay="$RUNNER_TEMP/raz-source-overlay"
          mkdir -p "$overlay/.github/workflows" "$overlay/assets/icons" "$overlay/config" "$overlay/scripts"
          cp .github/workflows/build-android.yml "$overlay/.github/workflows/"
          cp assets/icons/raz_launcher.xml "$overlay/assets/icons/"
          cp config/brand.json "$overlay/config/"
          cp scripts/apply_branding.py "$overlay/scripts/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md BUILD_STATUS_FA.md "$overlay/"
          printf '%s\n' \
            'RAZ - یادداشت امضای نسخه آزمایشی' \
            '' \
            'این APK با کلید امضای debug ثابت برای بیلدهای شخصی RAZ امضا می‌شود.' \
            'فینگرپرینت گواهی در فایل RAZ-signing-certificate-sha256.txt داخل بسته APK/Source artifact است.' \
            'فایل debug.keystore به‌عنوان artifact جداگانه با نام RAZ-debug-signing-key-backup نگه‌داری می‌شود' \
            'و workflow در اجرای بعدی ابتدا cache و سپس آخرین artifact خصوصی را برای بازیابی کلید بررسی می‌کند.' \
            'این کلید و این APK مخصوص تست شخصی است؛ کلید debug را برای انتشار عمومی استفاده نکنید.' \
            'برای انتشار عمومی باید کلید release جداگانه، نگهداری امن آن و تنظیم secrets انجام شود.' \
            > "$overlay/SIGNING_NOTES_FA.txt"
          (cd "$overlay" && zip -qr "$GITHUB_WORKSPACE/artifact/RAZ-source-overlay.zip" .)

      - name: Upload RAZ APK and source files
        uses: actions/upload-artifact@v4
        with:
          name: RAZ-debug-arm64
          path: artifact/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload persistent signing key backup (private repo only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAZ-debug-signing-key-backup
          path: ~/.android/debug.keystore
          if-no-files-found: error
          retention-days: 90
