name: Build RAZ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'
      - 'scripts/apply_branding.py'
      - 'config/brand.json'
      - 'assets/icons/**'

permissions:
  contents: write

concurrency:
  group: raz-android-build-universal
  cancel-in-progress: true

jobs:
  build-universal:
    name: Build debug APK (ARMv7 + ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
    steps:
      - name: Checkout RAZ customization files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate API secrets (optional for test-only build)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TG_API_ID" && -z "$TG_API_HASH" ]]; then
            echo "::warning::No personal Telegram API credentials supplied. This build will use the upstream sample credentials for testing only. Do not distribute this APK."
          elif [[ ! "$TG_API_ID" =~ ^[0-9]+$ || ! "$TG_API_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::Set both TG_API_ID and TG_API_HASH to valid values, or leave both unset for a test-only build."
            exit 1
          fi

      - name: Free disk space for dual-ABI native build
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # GitHub's Ubuntu image includes large toolchains irrelevant to an Android-only build.
          # Keep Java, Android command-line tools, required SDK platforms, NDK, and CMake.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/chromium /usr/share/swift
          if [[ -d "$ANDROID_SDK_ROOT/system-images" ]]; then
            sudo rm -rf "$ANDROID_SDK_ROOT/system-images"
          fi
          if [[ -d "$ANDROID_SDK_ROOT/emulator" ]]; then
            sudo rm -rf "$ANDROID_SDK_ROOT/emulator"
          fi
          if command -v docker >/dev/null 2>&1; then
            docker system prune --all --force --volumes || true
          fi
          echo "Disk space after cleanup:"
          df -h /
          avail_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [[ "$avail_kb" -lt 6000000 ]]; then
            echo "::warning::Less than 6 GB free after cleanup; multi-ABI native build may run out of disk."
          fi

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Download pinned official Telegram Android source
        env:
          UPSTREAM_COMMIT: f32ffeec763f0bdbf4bec25b52d654f77bff733d
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/DrKLO/Telegram.git upstream
          git -C upstream fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"
          git -C upstream submodule sync --recursive
          git -C upstream submodule update --init --recursive --depth=1
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          echo "Upstream commit: $(git -C upstream rev-parse HEAD)" | tee upstream-commit.txt

      - name: Apply RAZ branding
        env:
          RAZ_ALLOW_UPSTREAM_TEST_API: '1'
        run: python3 scripts/apply_branding.py upstream

      - name: Set a unique RAZ app version for this build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          properties = Path("upstream/gradle.properties")
          source = properties.read_text(encoding="utf-8")
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          version_name = f"3.13.{run_number}.{run_attempt}"
          version_code_match = re.search(r"(?m)^APP_VERSION_CODE=(\d+)$", source)
          if not version_code_match:
              raise SystemExit("Could not find APP_VERSION_CODE in upstream gradle.properties")
          version_code = int(version_code_match.group(1)) + run_number * 100 + run_attempt
          source, name_count = re.subn(r"(?m)^APP_VERSION_NAME=.*$", f"APP_VERSION_NAME={version_name}", source, count=1)
          source, code_count = re.subn(r"(?m)^APP_VERSION_CODE=\d+$", f"APP_VERSION_CODE={version_code}", source, count=1)
          if name_count != 1 or code_count != 1:
              raise SystemExit(f"Could not update RAZ version fields (name={name_count}, code={code_count})")
          properties.write_text(source, encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"RAZ_VERSION_NAME={version_name}\n")
              env.write(f"RAZ_VERSION_CODE={version_code}\n")
          print(f"RAZ app version: {version_name} (versionCode {version_code})")
          PY

      - name: Configure debug build for ARMv7 + ARM64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          app_path = Path("upstream/TMessagesProj_App/build.gradle")
          app_source = app_path.read_text()
          app_pattern = r'(?m)^([ \t]*afat[ \t]*\{[ \t]*\n[ \t]*ndk[ \t]*\{[ \t]*\n[ \t]*abiFilters[ \t]+)[^\n]+'
          app_updated, app_count = re.subn(app_pattern, r'\1"armeabi-v7a", "arm64-v8a"', app_source, count=1)
          if app_count != 1:
              raise SystemExit("Could not locate the app afat ABI filter; refusing an unsafe build edit")
          app_path.write_text(app_updated)

          library_path = Path("upstream/TMessagesProj/build.gradle")
          library_source = library_path.read_text()
          library_anchor = '        minSdkVersion 23\n        targetSdkVersion 36\n'
          if library_source.count(library_anchor) != 1:
              raise SystemExit("Could not locate the library defaultConfig SDK settings; refusing an unsafe build edit")
          library_updated = library_source.replace(
              library_anchor,
              library_anchor + '\n        ndk {\n            abiFilters "armeabi-v7a", "arm64-v8a"\n        }\n',
              1,
          )
          library_path.write_text(library_updated)
          print("Configured app and Telegram library native builds for armeabi-v7a and arm64-v8a")
          PY

      - name: Build multi-ABI debug APK (ARMv7 + ARM64)
        env:
          GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Collect APK, source overlay, and signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact "$RUNNER_TEMP/raz-source-overlay"
          apk_name="RAZ-${RAZ_VERSION_NAME}-armv7-arm64.apk"
          cp upstream/TMessagesProj_App/build/outputs/apk/afat/debug/app.apk "artifact/$apk_name"
          echo "Versioned APK: $apk_name"
          cp upstream-commit.txt artifact/
          keytool -list -v -keystore "upstream/TMessagesProj/config/release.keystore" -storepass android -alias androidkey \
            | awk '/SHA256:/ {print $0}' > artifact/RAZ-signing-certificate-sha256.txt
          test -s artifact/RAZ-signing-certificate-sha256.txt

          overlay="$RUNNER_TEMP/raz-source-overlay"
          mkdir -p "$overlay/.github/workflows" "$overlay/assets/icons" "$overlay/config" "$overlay/scripts"
          cp .github/workflows/build-android.yml "$overlay/.github/workflows/"
          cp assets/icons/raz_launcher.xml "$overlay/assets/icons/"
          cp config/brand.json "$overlay/config/"
          cp scripts/apply_branding.py "$overlay/scripts/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md BUILD_STATUS_FA.md "$overlay/"
          printf '%s\n' \
            'RAZ - یادداشت امضای نسخه آزمایشی' \
            '' \
            'این APK با keystore آزمایشیِ موجود در سورس pinned تلگرام امضا می‌شود؛ بیلدهای همین سورس اثرانگشت یکسان دارند.' \
            'فینگرپرینت گواهی در فایل RAZ-signing-certificate-sha256.txt داخل بسته APK/Source artifact است.' \
            'فایل keystore آزمایشی با نام RAZ-upstream-test-signing-key-reference به‌عنوان artifact جداگانه نگه‌داری می‌شود' \
            'این کلید در سورس عمومی upstream موجود است و برای انتشار عمومی امن یا خصوصی محسوب نمی‌شود.' \
            'این APK فقط برای تست است؛ برای انتشار عمومی باید کلید release اختصاصی RAZ را خصوصی نگه داشت.' \
            'برای انتشار عمومی باید کلید release جداگانه، نگهداری امن آن و تنظیم secrets انجام شود.' \
            > "$overlay/SIGNING_NOTES_FA.txt"
          (cd "$overlay" && zip -qr "$GITHUB_WORKSPACE/artifact/RAZ-source-overlay.zip" .)

      - name: Upload RAZ APK and source files
        uses: actions/upload-artifact@v4
        with:
          name: RAZ-debug-armv7-arm64
          path: artifact/*
          if-no-files-found: error
          retention-days: 90

      - name: Store the APK in GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${RAZ_VERSION_NAME}"
          apk_path="artifact/RAZ-${RAZ_VERSION_NAME}-armv7-arm64.apk"
          notes="Automated RAZ test build from commit ${GITHUB_SHA}. The APK contains both ARMv7 and ARM64 native libraries. This is a test build, not a stable public release."

          if [[ -n "${TG_API_ID}" && -n "${TG_API_HASH}" ]]; then
            gh release create "$tag" "$apk_path" \
              artifact/RAZ-source-overlay.zip \
              artifact/RAZ-signing-certificate-sha256.txt \
              artifact/upstream-commit.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "RAZ ${RAZ_VERSION_NAME}" \
              --notes "$notes" \
              --prerelease
            echo "Published RAZ ${RAZ_VERSION_NAME} as a prerelease."
          else
            gh release create "$tag" "$apk_path" \
              artifact/RAZ-source-overlay.zip \
              artifact/RAZ-signing-certificate-sha256.txt \
              artifact/upstream-commit.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "RAZ ${RAZ_VERSION_NAME} (draft test build)" \
              --notes "$notes. Telegram API secrets are not configured, so this draft is not publicly distributed. Add TG_API_ID and TG_API_HASH repository secrets to publish builds as prereleases." \
              --draft
            echo "Stored RAZ ${RAZ_VERSION_NAME} in a draft release."
          fi

      - name: Upload pinned upstream test signing keystore reference
        uses: actions/upload-artifact@v4
        with:
          name: RAZ-upstream-test-signing-key-reference
          path: upstream/TMessagesProj/config/release.keystore
          if-no-files-found: error
          retention-days: 90
